# Testes do serviço de IA em todo pull request e em todo envio para a main.
#
# "ci": a suíte pytest com as versões travadas do serviço (requirements-servico.lock) mais as de
# teste (requirements-teste.txt). É esse nome que a regra da branch main exige.
# "imagem": confere que a imagem Docker do serviço continua sendo gerada.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-servico.lock
            requirements-teste.txt
      - run: pip install -r requirements-servico.lock -r requirements-teste.txt
      - run: python -m pytest -q

  imagem:
    name: imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sima-ml-service .
