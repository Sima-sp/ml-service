# Versões EXATAS do serviço em produção (imagem Docker) — geradas em 20/09/2026.
#
# São as mesmas do ambiente que treinou models/flood_lgbm_v1.joblib. O joblib guarda objetos do
# scikit-learn e do LightGBM do jeito que eles são naquela versão: com outra versão o modelo pode
# não carregar, ou carregar e prever diferente. Por isso este arquivo e o .joblib andam juntos —
# atualizou uma biblioteca, treina de novo e gera este arquivo de novo.
#
# Contém só o fecho de dependências de requirements-servico.txt (sem jupyter, geopandas, pytest).
# O ambiente completo de treino está em requirements.lock.
# tzdata entra para a conversão de fuso (America/Sao_Paulo) não depender do sistema da imagem.
